name: Update A-share market data

on:
  schedule:
    # 10:00 UTC = 18:00 Asia/Shanghai, weekdays after A-share close.
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-a-share-market
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      TRACKER_PROJECT_DIR: ${{ github.workspace }}
      # 手动触发（workflow_dispatch）时强制刷新；定时触发保留幂等，避免重复提交
      FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update market data and HTML
        run: python "更新A股行情.py"

      - name: Validate update
        run: |
          if [ -f SKIP_REASON.txt ]; then
            echo "今日跳过更新：$(cat SKIP_REASON.txt)"
            exit 0
          fi
          python - <<'PY'
          import datetime as _dt
          import json, os, sys
          try:
              from zoneinfo import ZoneInfo
              SH = ZoneInfo("Asia/Shanghai")
          except Exception:
              SH = None
          today = _dt.datetime.now(SH).date() if SH else _dt.datetime.now().date()
          p = "market-data.json"
          if not os.path.exists(p):
              print("market-data.json 缺失"); sys.exit(1)
          d = json.load(open(p, encoding="utf-8"))
          quotes = d.get("quotes", {})
          if len(quotes) != 13:
              print(f"公司数量异常: {len(quotes)}"); sys.exit(1)
          quote_dates = set()
          for code, q in quotes.items():
              qt = (q.get("quote_time") or "")[:10]
              quote_dates.add(qt)
              if q.get("price") is None or q.get("market_cap_yi") is None:
                  print(f"{q.get('name')} 价格/市值缺失"); sys.exit(1)
          if len(quote_dates) != 1:
              print(f"行情日期不一致: {sorted(quote_dates)}"); sys.exit(1)
          quote_date = _dt.date.fromisoformat(next(iter(quote_dates)))
          age_days = (today - quote_date).days
          if age_days < 0 or age_days > 10:
              print(f"行情日期异常: quote_date={quote_date}, today={today}, age_days={age_days}"); sys.exit(1)
          print(f"校验通过：13 家公司行情日期一致，quote_date={quote_date}。")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "market-data.json" "weekly-observations.json" "行情更新日志.txt" "2026 H2 吴梓豪A股公司追踪 2026.7.html" "index.html"
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update A-share market data"
            git push
          fi
