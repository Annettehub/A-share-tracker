name: Update A-share market data

on:
  schedule:
    # 09:00 UTC = 17:00 Asia/Shanghai
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      TRACKER_PROJECT_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update market data and HTML
        run: python "更新A股行情.py"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "market-data.json" "行情更新日志.txt" "2026 H2 吴梓豪A股公司追踪 2026.7.html"
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update A-share market data"
            git push
          fi
