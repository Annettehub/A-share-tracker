name: Update A-share market data

on:
  schedule:
    # 09:20 UTC = 17:20 Asia/Shanghai, after A-share close.
    - cron: "20 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-a-share-market
  cancel-in-progress: false

jobs:
  update:
    if: false  # disabled 2026-08-19: migrated to WorkBuddy scheduled automation
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Shanghai
      TRACKER_PROJECT_DIR: ${{ github.workspace }}
      # 手动触发（workflow_dispatch）时强制刷新；定时触发保留幂等，避免重复提交
      FORCE_UPDATE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Update market data and HTML
        run: python "更新A股行情.py"

      - name: Validate update
        run: |
          if [ -f SKIP_REASON.txt ]; then
            echo "今日跳过更新：$(cat SKIP_REASON.txt)"
            exit 0
          fi
          python - <<'PY'
          import datetime as _dt
          import json, os, sys
          try:
              from zoneinfo import ZoneInfo
              SH = ZoneInfo("Asia/Shanghai")
          except Exception:
              SH = None
          today = _dt.datetime.now(SH).strftime("%Y-%m-%d") if SH else _dt.datetime.now().strftime("%Y-%m-%d")
          p = "market-data.json"
          if not os.path.exists(p):
              print("market-data.json 缺失"); sys.exit(1)
          d = json.load(open(p, encoding="utf-8"))
          quotes = d.get("quotes", {})
          if len(quotes) != 13:
              print(f"公司数量异常: {len(quotes)}"); sys.exit(1)
          for code, q in quotes.items():
              qt = (q.get("quote_time") or "")[:10]
              if qt != today:
                  print(f"{q.get('name')} 行情日期 {qt} 非今日 {today}"); sys.exit(1)
              if q.get("price") is None or q.get("market_cap_yi") is None:
                  print(f"{q.get('name')} 价格/市值缺失"); sys.exit(1)
          print("校验通过：13 家公司均为今日行情。")
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "market-data.json" "weekly-observations.json" "行情更新日志.txt" "2026 H2 吴梓豪A股公司追踪 2026.7.html" "index.html"
          if git diff --cached --quiet; then
            echo "No market data changes to commit."
          else
            git commit -m "Update A-share market data"
            git push
          fi
